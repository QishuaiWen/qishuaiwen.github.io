<footer class="footer flex-shrink-0 border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
    <div style="max-width: 360px; margin: 24px auto; padding: 0 12px;">
        <script src="https://statable.com/js/r2V49BF0cf/t/mw.js" data-id="3437672" data-theme="light" data-primary-color="#007BFF" data-ocean-color="#FFFFFF"></script>
    </div>
</footer>
